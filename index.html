<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Med Hours</title>

    <meta name="theme-color" content="#2563eb">

    <link rel="manifest" href="manifest.json">

    <link rel="stylesheet" href="style.css">

</head>


<body>


<div class="container">


    <h1>💊 Med Hours</h1>


    <p class="description">
        حساب وقت الجرعات القادمة بسهولة
    </p>



    <div class="card">


        <h2>إدخال آخر جرعة</h2>


        <label>
            التاريخ
        </label>

        <input type="date" id="date">



        <br><br>


        <label>
            الوقت
        </label>


        <div class="time-select">


            <select id="hour">

                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">10</option>
                <option value="11">11</option>
                <option value="12">12</option>

            </select>



            <select id="minute">

            </select>



            <select id="ampm">

                <option value="AM">
                    AM
                </option>

                <option value="PM">
                    PM
                </option>

            </select>


        </div>



        <br>


        <label>
            تكرار الدواء
        </label>


        <select id="interval">


            <option value="4">
                كل 4 ساعات
            </option>


            <option value="6">
                كل 6 ساعات
            </option>


            <option value="8">
                كل 8 ساعات
            </option>


            <option value="12">
                كل 12 ساعة
            </option>


            <option value="24">
                كل 24 ساعة
            </option>


        </select>



        <br><br>



        <button id="saveManual">
            حفظ الجرعة
        </button>


        <br><br>


        <button id="saveDose">
            أخذت الدواء الآن
        </button>


    </div>






    <div class="card">


        <h2>
            آخر جرعة
        </h2>


        <div id="lastDose">

            لا توجد بيانات

        </div>


    </div>






    <div class="card">


        <h2>
            الوقت منذ آخر جرعة
        </h2>


        <div id="elapsed">

            --

        </div>


    </div>







    <div class="card">


        <h2>
            الجرعة القادمة
        </h2>


        <div id="nextDose">

            --

        </div>



        <h2>
            الوقت المتبقي
        </h2>


        <div id="remaining">

            --

        </div>



    </div>





</div>




<script src="script.js"></script>


</body>


</html>
